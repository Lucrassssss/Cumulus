# Runs on every push and pull request: the fast static check, then the
# Playwright smoke suite (mobile + desktop). External services (Supabase,
# Mapbox, Stripe) aren't needed — the suite stubs or tolerates them.
name: Tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --trace off
        env: { CI: "true" }
