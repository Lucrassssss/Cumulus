<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>Cumulus — What's on in London tonight</title>

    <!-- ══ CDN Preconnects ══ -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.mapbox.com" />
    <link rel="preconnect" href="https://events.mapbox.com" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />

    <!-- ══ iOS / PWA ══ -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Cumulus" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="theme-color"
      content="#08080A"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="theme-color"
      content="#F3F1EC"
      media="(prefers-color-scheme: light)"
    />

    <!-- Theme before first paint (no flash). Mirrors themeForNow() in
     03-core-theme.js: saved preference → light/dark/system, else LONDON
     time (light 06:00–17:59). -->
    <script>
      (function () {
        try {
          var pref = null;
          try {
            pref = localStorage.getItem("cumulus_theme_pref");
          } catch (e) {}
          var t;
          if (pref === "light" || pref === "dark") t = pref;
          else if (pref === "system")
            t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          else {
            var h;
            try {
              h = parseInt(
                new Intl.DateTimeFormat("en-GB", {
                  timeZone: "Europe/London",
                  hour: "numeric",
                  hourCycle: "h23",
                }).format(new Date()),
                10,
              );
            } catch (e) {
              h = new Date().getHours();
            }
            t = h >= 6 && h < 18 ? "light" : "dark";
          }
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
    <meta
      name="description"
      content="Cumulus — London community events. Your city, your people."
    />
    <link rel="canonical" href="https://cumulusapp.co/" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/svg+xml" href="assets/icons/icon.svg?v=2" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="assets/icons/favicon-32.png?v=2"
    />
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png?v=2" />

    <!-- ══ Social share previews ══ -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cumulus" />
    <meta property="og:title" content="Cumulus — London Community Events" />
    <meta
      property="og:description"
      content="London community events. Your city, your people."
    />
    <meta property="og:url" content="https://cumulusapp.co/" />
    <meta
      property="og:image"
      content="https://cumulusapp.co/assets/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cumulus — London Community Events" />
    <meta
      name="twitter:description"
      content="London community events. Your city, your people."
    />
    <meta
      name="twitter:image"
      content="https://cumulusapp.co/assets/og-image.png"
    />
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"
    ></script>
    <!-- Bricolage Grotesque (display, variable width) + Inter (body) +
         JetBrains Mono (dates, prices, ticket codes). -->

      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Inter:opsz,wght@14..32,400..800&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://api.mapbox.com/mapbox-gl-js/v3.18.0/mapbox-gl.css"
      rel="stylesheet"
    />
    <script
      defer
      src="https://api.mapbox.com/mapbox-gl-js/v3.18.0/mapbox-gl.js"
    ></script>
    <script

      src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"

    <script defer src="https://js.stripe.com/v3/"></script>
    <link rel="stylesheet" href="src/css/styles.css" />
    <link rel="stylesheet" href="src/css/v2.css" />
  </head>
